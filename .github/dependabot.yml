# Keeps the SHA-pinned actions in ci.yml and the pnpm dependencies current.
# Weekly and grouped: one PR per ecosystem, because CodeRabbit reviews about one PR per hour.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # "npm" covers pnpm workspaces (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
