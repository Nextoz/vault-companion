name: ci

# Branch pushes are covered by their pull request run; `push` on every branch ran each PR commit twice.
# workflow_dispatch runs CI on a branch that has no PR yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded branch/PR runs are cancelled; main runs are not, so every main commit (a deploy candidate) gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Same order as `pnpm ci:local`: lint, typecheck, test, e2e, audit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No `version` input: the action reads `packageManager` from the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright WebKit
        if: runner.os == 'Linux'
        run: pnpm --filter @vault-companion/web exec playwright install --with-deps webkit chromium

      - name: Web e2e
        if: runner.os == 'Linux'
        run: pnpm --filter @vault-companion/web e2e

      # Traces and error context from failed e2e tests (playwright.config.ts: trace retain-on-failure).
      - name: Upload Playwright results
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # The Worker bundle `wrangler deploy` would upload (dry run: no account, no network writes).
      - name: Worker bundle (deploy dry run)
        if: runner.os == 'Linux'
        run: pnpm deploy:dry

      - name: Audit
        run: pnpm audit --prod --audit-level high

      - name: Gitleaks
        if: runner.os == 'Linux'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting on PRs would need pull-requests: write; findings fail the job instead.
          GITLEAKS_ENABLE_COMMENTS: false

  deploy:
    name: deploy production
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @vault-companion/web build

      - name: Record previous version
        id: previous
        run: |
          PREVIOUS_VERSION="$(node tools/smoke-test.mjs current-version)"
          echo "previous_version=${PREVIOUS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        working-directory: apps/worker
        run: |
          set -o pipefail
          pnpm exec wrangler deploy \
            --domain "$PRODUCTION_HOST" \
            --tag "$GITHUB_SHA" 2>&1 | tee deploy.log

      - name: Extract new version
        id: new
        run: |
          NEW_VERSION="$(node tools/smoke-test.mjs deploy-version --file apps/worker/deploy.log)"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Smoke test and roll back on failure
        run: |
          node tools/smoke-test.mjs \
            --base-url "https://$PRODUCTION_HOST" \
            --new-version "${{ steps.new.outputs.new_version }}" \
            --previous-version "${{ steps.previous.outputs.previous_version }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"
